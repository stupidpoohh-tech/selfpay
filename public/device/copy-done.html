<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 완료 | 복합기 TO-BE 목업</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/font.css?v=2">
<link rel="stylesheet" href="assets/device.css?v=2">
</head>
<body data-svc="copy">

<div class="stage">
<div class="screen" style="position:relative">

  <!-- 팝업 뒤에는 방금까지 보던 복사 화면이 그대로 남는다 -->
  <header class="top top--plain">
    <div class="top__wrap">
      <span class="homebtn" aria-hidden="true"><i data-ico="home"></i>홈으로</span>
      <span class="top__title">복사</span>
      <span style="margin-left:auto;width:1px"></span>
    </div>
  </header>

  <div class="body body--split" aria-hidden="true">
    <div class="side">
      <div class="card card--soft" style="flex:none;padding:26px 28px">
        <p class="card__title" style="font-size:27px">복사할 원본 문서</p>
        <p class="card__note" style="margin-top:6px">아래와 같이 복사됩니다.</p>
      </div>
      <div class="preview" style="background:var(--panel);border-color:var(--line)">
        <div class="paper">
          <div class="paper__band" id="band"></div>
          <div class="paper__line paper__line--m"></div>
          <div class="paper__img"></div>
          <div class="paper__line"></div>
        </div>
        <span class="preview__sum" id="sum">컬러 · 단면 · 1부</span>
      </div>
      <div class="fee">
        <p class="fee__title">복사 금액 안내</p>
        <p class="fee__row"><span class="dot dot--color"></span>컬러<b>250<span>원/장</span></b></p>
        <p class="fee__row"><span class="dot dot--mono"></span>흑백<b>50<span>원/장</span></b></p>
      </div>
    </div>
    <div class="card"></div>
  </div>

  <footer class="foot" aria-hidden="true">
    <span class="foot__note">
      <span style="color:var(--brand);display:inline-flex;width:44px;height:44px" data-ico="phone"></span>
      <span>
        <b>설정을 확인한 뒤 휴대폰에서 결제를 진행해 주세요.</b>
        <span>결제가 완료되면 자동으로 복사가 시작됩니다.</span>
      </span>
    </span>
    <span class="spacer"></span>
    <span class="btn is-off"><i data-ico="docs"></i>복사 시작</span>
  </footer>

  <!-- 완료 팝업 -->
  <div class="dim">
    <div class="modal" role="dialog" aria-labelledby="done-h">
      <button type="button" class="modal__x" id="close" aria-label="닫기"><i data-ico="x"></i></button>

      <div class="modal__head">
        <span class="modal__ico"><i data-ico="check"></i></span>
        <h1 class="modal__h" id="done-h">복사가 완료되었습니다</h1>
      </div>

      <p class="modal__p">
        <span id="nth">1번째</span> 복사가 완료되었습니다.<br>
        현재 누적 금액 <b id="total">250원</b><br>
        추가로 복사할 문서가 있으면 계속 진행할 수 있습니다.
      </p>

      <div class="modal__btns">
        <button type="button" class="btn btn--ghost" data-go="copy-start.html">추가 복사</button>
        <button type="button" class="btn btn--go" data-go="payment.html">결제하기</button>
      </div>
    </div>
  </div>

</div>
</div>

<script src="assets/icons.js?v=2"></script>
<script src="assets/device.js?v=2"></script>
<script>
  SPIco.fill();

  var list = SPDev.state.job.list;
  /* 복사 화면을 거치지 않고 바로 열었으면 한 건 있는 것으로 둔다 */
  if (!list.length) { SPDev.addJob(); list = SPDev.state.job.list; }

  document.getElementById('nth').textContent = list.length + '번째';
  document.getElementById('total').textContent = SPDev.won(SPDev.jobTotal()) + '원';
  document.getElementById('sum').textContent = SPDev.copySummary();
  if (SPDev.state.copy.color === 'mono') {
    document.getElementById('band').className = 'paper__band paper__band--mono';
  }

  /* 닫으면 이번 세션의 작업을 비우고 대기 화면으로 돌아간다 */
  document.getElementById('close').addEventListener('click', function () {
    SPDev.clearJobs();
    SPDev.go('home.html');
  });

  SPDev.start();
</script>
</body>
</html>
