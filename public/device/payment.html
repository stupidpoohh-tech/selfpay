<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 | 복합기 TO-BE 목업</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/font.css?v=2">
<link rel="stylesheet" href="assets/device.css?v=3">
</head>
<body data-svc="copy">

<div class="stage">
<div class="screen">

  <header class="top">
    <div class="top__wrap">
      <span class="foot__note" style="gap:16px">
        <span style="color:var(--accent);display:inline-flex;width:52px;height:52px" data-ico="docs"></span>
        <span>
          <b style="font-size:23px;font-weight:700;color:var(--muted)">언제 어디서나,</b>
          <span style="font-size:23px;color:var(--muted);margin-top:2px" id="brandsub">간편한 모바일 복사</span>
        </span>
      </span>
      <span class="top__title" id="title">복사 · 결제 대기</span>
      <span class="spacer"></span>
      <span style="font-size:25px;font-weight:700;color:var(--muted)" id="waiting">결제를 기다리는 작업 1건</span>
    </div>
  </header>

  <div class="pay">
    <!-- 왼쪽: 무엇을 결제하는지 -->
    <div class="card jobs">
      <div class="card__head">
        <p class="card__title" id="jobsttl">복사 작업 내역</p>
        <span class="spacer"></span>
        <span style="font-size:23px;font-weight:700;color:var(--muted)" id="cnt">결제 대기 1건</span>
      </div>
      <div class="jobs__list" id="jobs"></div>
    </div>

    <!-- 오른쪽: 지금 어디까지 왔는지 -->
    <div class="card wait">
      <span class="wait__ico" style="color:var(--accent)"><i data-ico="wonpay"></i></span>

      <h1 class="wait__h">앱에서 <b id="won">150원</b>을<br>결제해 주세요</h1>
      <p class="wait__p" id="lead">결제가 확인되면 복사가 자동으로 시작됩니다.</p>

      <div class="steps" id="steps">
        <span class="steps__i is-done" data-step="0">
          <span class="steps__dot"><i data-ico="check"></i></span>
          <span class="steps__t">결제 요청</span>
        </span>
        <span class="steps__bar is-done"></span>
        <span class="steps__i is-now" data-step="1">
          <span class="steps__dot"><i data-ico="check"></i></span>
          <span class="steps__t">결제 확인 중</span>
        </span>
        <span class="steps__bar"></span>
        <span class="steps__i" data-step="2">
          <span class="steps__dot"><i data-ico="check"></i></span>
          <span class="steps__t" id="step3">복사 시작</span>
        </span>
      </div>

      <div class="timer" id="timer">
        <p class="timer__row">세션 만료까지 <b id="left">1:00</b></p>
        <div class="timer__bar"><span class="timer__fill" id="fill" style="width:100%"></span></div>
      </div>
    </div>
  </div>

  <footer class="foot" style="min-height:120px">
    <span class="foot__note">
      <span style="color:var(--muted-2);display:inline-flex;width:40px;height:40px" data-ico="warn"></span>
      <b style="font-weight:700;color:var(--ink-2)" id="note">앱에서 결제가 확인되면 복합기에서 자동으로 작업이 시작됩니다.</b>
    </span>
    <span class="spacer"></span>
    <button type="button" class="btn btn--warn btn--sm" id="cancel">결제 취소</button>
  </footer>

</div>
</div>

<script src="assets/icons.js?v=3"></script>
<script src="assets/device.js?v=3"></script>
<script>
  SPIco.fill();

  /* 어떤 서비스의 결제인지에 따라 문구만 갈아 끼운다.
   * 금액은 설정 화면에서 보던 그 값을 그대로 가져온다. */
  var key = SPDev.svcKey();
  var svc = SPDev.svc(key);
  document.body.setAttribute('data-svc', key);

  var job = SPDev.ensurePending(key);

  /* 결제할 작업 내역 */
  document.getElementById('jobs').innerHTML =
    '<div class="job">' +
      '<span class="job__n">1</span>' +
      '<span><span class="job__name">' + job.label + '</span>' +
      '<span class="job__meta">' + job.meta + '</span></span>' +
      '<span class="job__won">' + SPDev.won(job.won) + '원</span></div>';

  document.getElementById('title').textContent = svc.name + ' · 결제 대기';
  document.getElementById('brandsub').textContent = '간편한 모바일 ' + svc.name;
  document.getElementById('jobsttl').textContent = svc.name + ' 작업 내역';
  document.getElementById('cnt').textContent = '결제 대기 1건';
  document.getElementById('waiting').textContent = '결제를 기다리는 작업 1건';
  document.getElementById('won').textContent = SPDev.won(SPDev.payTotal()) + '원';
  document.getElementById('lead').textContent = '결제가 확인되면 ' + svc.doingI + ' 자동으로 시작됩니다.';
  document.getElementById('step3').textContent = svc.doing + ' 시작';

  /* 세션 만료까지 남은 시간. 60초에서 줄어든다 */
  var LIMIT = 60, left = LIMIT, done = false;
  var elLeft = document.getElementById('left');
  var elFill = document.getElementById('fill');

  function tick() {
    if (done) return;
    left--;
    elLeft.textContent = Math.floor(left / 60) + ':' + String(Math.max(0, left % 60)).padStart(2, '0');
    elFill.style.width = Math.max(0, left / LIMIT * 100) + '%';
    if (left <= 0) { clearInterval(timer); expire(); }
  }
  var timer = setInterval(tick, 1000);

  /* 결제가 확인되면 복합기에서 아무것도 누르지 않아도 작업이 시작된다.
   * 목업에서는 잠시 뒤 확인된 것으로 보고 그 상태를 이어서 보여 준다. */
  var auto = setTimeout(paid, 7000);

  function step(i, cls) {
    var el = document.querySelector('[data-step="' + i + '"]');
    el.classList.remove('is-now', 'is-done');
    if (cls) el.classList.add(cls);
  }

  function paid() {
    done = true;
    clearInterval(timer);
    step(1, 'is-done');
    document.querySelectorAll('.steps__bar')[1].classList.add('is-done');
    step(2, 'is-now');
    document.querySelector('.wait__h').innerHTML =
      '결제가 확인되었습니다<br><b>' + svc.doingEul + ' 시작합니다</b>';
    document.getElementById('lead').textContent = '복합기에서 따로 누를 것은 없습니다.';
    document.getElementById('note').textContent = '결제가 확인되어 ' + svc.doingEul + ' 시작했습니다.';
    document.getElementById('timer').style.visibility = 'hidden';
    /* 결제가 끝난 건으로 옮기고 작업 완료 화면으로 넘어간다 */
    setTimeout(function () {
      step(2, 'is-done');
      SPDev.confirmPay();
      setTimeout(function () { SPDev.go('copy-done.html'); }, 2200);
    }, 2600);
  }

  function expire() {
    done = true;
    clearTimeout(auto);
    document.querySelector('.wait__h').innerHTML = '결제 시간이 지났습니다';
    document.getElementById('lead').textContent = '휴대폰에서 다시 요청해 주세요.';
  }

  /* 결제 전이므로 취소하면 설정 화면으로 되돌아간다 */
  document.getElementById('cancel').addEventListener('click', function () {
    clearInterval(timer); clearTimeout(auto);
    SPDev.state.job.pending = null;
    SPDev.save();
    SPDev.go(svc.page);
  });

  SPDev.start();
</script>
</body>
</html>
