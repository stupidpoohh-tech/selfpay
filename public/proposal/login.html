<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로그인 · 제안 | 무인과금출력</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/font.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/proposal.css">
</head>
<body>
<div class="app">
  <header class="p-appbar">
    <div class="p-appbar__brand"><img src="../assets/img/logo.svg" alt="">무인과금출력</div>
    <button class="p-help" data-go="help.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.8.7-.8 1.3v.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/>
      </svg>도움말
    </button>
  </header>

  <main class="p-page">
    <div class="p-topart p-topart--login">
      <div class="p-art" data-art="printer"></div>
      <h1 class="p-h1">로그인하고<br>작업을 이어가세요.</h1>
      <p class="p-sub">언제 어디서나, 간편하게 출력하세요.</p>
    </div>

    <form class="p-form" id="loginForm" style="margin-top:20px" novalidate>
      <div class="p-field">
        <div class="p-field__row"><label class="p-field__label" for="email">이메일</label></div>
        <input class="p-input" type="email" id="email" placeholder="example@email.com" autocomplete="username">
      </div>
      <div class="p-field">
        <div class="p-field__row">
          <label class="p-field__label" for="pw">비밀번호</label>
          <a class="p-field__link" href="find-password.html">비밀번호 찾기</a>
        </div>
        <div style="position:relative">
          <input class="p-input p-input--icon" type="password" id="pw" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
          <button class="p-eye" type="button" id="pwToggle" aria-label="비밀번호 보기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="p-btn" type="submit" style="margin-top:18px">로그인
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="p-divider">다른 방법으로 계속하기</div>

    <button class="p-social" data-social="kakao">
      <svg class="p-social__icon" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#FEE500"/>
        <path d="M20 10c-5.5 0-10 3.4-10 7.6 0 2.7 1.9 5 4.7 6.3l-1.1 4c-.1.4.3.7.6.5l4.7-3.1c.4 0 .7.1 1.1.1 5.5 0 10-3.4 10-7.8S25.5 10 20 10Z" fill="#191600"/>
      </svg>
      카카오로 시작하기
      <svg class="p-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <button class="p-social" data-social="naver">
      <svg class="p-social__icon" viewBox="0 0 40 40">
        <path d="M11 10h6.6l5 7.6V10H29v20h-6.6l-5-7.6V30H11V10Z" fill="#03C75A"/>
      </svg>
      네이버로 시작하기
      <svg class="p-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <button class="p-social" data-social="google">
      <svg class="p-social__icon" viewBox="0 0 40 40">
        <path d="M35 20.4c0-1.1-.1-2.1-.3-3.1H20v6h8.5c-.4 2-1.5 3.7-3.2 4.8v4h5.2c3-2.8 4.5-6.9 4.5-11.7Z" fill="#4285F4"/>
        <path d="M20 36c4.3 0 7.9-1.4 10.5-3.9l-5.2-4c-1.4 1-3.2 1.6-5.3 1.6-4.1 0-7.6-2.8-8.8-6.5H5.8v4.1C8.4 32.6 13.8 36 20 36Z" fill="#34A853"/>
        <path d="M11.2 23.2c-.3-1-.5-2-.5-3.2s.2-2.2.5-3.2v-4.1H5.8A16 16 0 0 0 4 20c0 2.6.6 5 1.8 7.3l5.4-4.1Z" fill="#FBBC05"/>
        <path d="M20 10.3c2.3 0 4.4.8 6.1 2.4l4.6-4.6C27.9 5.5 24.3 4 20 4 13.8 4 8.4 7.4 5.8 12.7l5.4 4.1c1.2-3.7 4.7-6.5 8.8-6.5Z" fill="#EA4335"/>
      </svg>
      Google로 시작하기
      <svg class="p-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <button class="p-social p-social--guest" data-go="guest.html">
      <svg class="p-social__icon" viewBox="0 0 40 40" fill="#7b8697">
        <circle cx="20" cy="15" r="6"/><path d="M8 33c0-6.2 5.4-10 12-10s12 3.8 12 10H8Z"/>
      </svg>
      비회원으로 이용하기
      <svg class="p-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <p class="p-secure">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
      </svg>
      회원님의 정보는 안전하게 보호됩니다.
    </p>

    <p class="p-foot">
      <span class="muted">계정이 없으신가요?</span> <a href="signup.html">회원가입</a>
      <span class="sep">|</span><a href="support.html" style="color:#7b8697">고객센터</a>
    </p>
  </main>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/proposal.js"></script>
<script>
  document.getElementById('pwToggle').addEventListener('click', function () {
    var pw = document.getElementById('pw');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email');
    var pw = document.getElementById('pw');
    if (!email.value.trim()) return email.focus();
    if (!pw.value) return pw.focus();
    location.href = 'index.html';
  });
  document.querySelectorAll('[data-social]').forEach(function (b) {
    b.addEventListener('click', function () { location.href = 'index.html'; });
  });
</script>
</body>
</html>
