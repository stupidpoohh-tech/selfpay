<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>설정 · 제안 | 무인과금출력</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/font.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/proposal.css">
</head>
<body>
<div class="app">
  <header class="p-appbar">
    <div class="p-appbar__brand"><img src="../assets/img/logo.svg" alt="">무인과금출력</div>
    <div class="p-appbar__actions">
      <button class="p-round" data-go="notifications.html" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>
        </svg>
      </button>
      <button class="p-round" data-go="settings.html" aria-label="내 정보">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21H4Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="p-page p-page--tab">
    <h1 class="p-h1 p-h1--sm" style="margin-top:10px">설정</h1>
    <p class="p-sub">더 편리한 출력을 위한 설정을 관리하세요.</p>

    <div class="p-card" style="margin-top:18px">
      <div class="p-user">
        <span class="p-user__avatar">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21H4Z"/>
          </svg>
        </span>
        <div>
          <div class="p-user__title">비회원으로 이용 중</div>
          <div class="p-user__desc">로그인하면 이력을 저장하고<br>더 많은 기능을 이용할 수 있어요.</div>
        </div>
        <button class="p-user__btn" data-go="login.html">로그인
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div class="p-card">
      <div class="p-cardhead">
        <span class="p-cardhead__icon" style="background:#e8f0ff;color:#2870ff">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.8-1.3-1.8-3.2-2.1.8a7.7 7.7 0 0 0-2.6-1.5L14.4 3h-3.7l-.3 2.3c-1 .3-1.8.8-2.6 1.5l-2.1-.8-1.8 3.2 1.8 1.3a7.6 7.6 0 0 0 0 3l-1.8 1.3 1.8 3.2 2.1-.8c.8.7 1.6 1.2 2.6 1.5l.3 2.3h3.7l.3-2.3c1-.3 1.8-.8 2.6-1.5l2.1.8 1.8-3.2-1.8-1.3Z"/></svg>
        </span>
        <div>
          <div class="p-cardhead__title">기본 출력 옵션</div>
          <div class="p-cardhead__desc">출력할 때 기본으로 설정되는 옵션이에요.</div>
        </div>
      </div>

      <div class="p-opts">
        <div class="p-opt">
          <span class="p-opt__icon" style="background:#eef2ff">
            <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="9.5" cy="9.5" r="5" fill="#ff5f6d" opacity=".85"/><circle cx="14.5" cy="9.5" r="5" fill="#ffd23f" opacity=".85"/><circle cx="12" cy="14" r="5" fill="#2f7cf6" opacity=".85"/></svg>
          </span>
          <span class="p-opt__label">컬러</span>
          <span class="p-opt__ctrl"><span class="p-seg2" data-opt><button class="is-on">컬러</button><button>흑백</button></span></span>
        </div>

        <div class="p-opt">
          <span class="p-opt__icon" style="background:#eaf1ff;color:#3b82f6">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h4"/></svg>
          </span>
          <span class="p-opt__label">양면</span>
          <span class="p-opt__ctrl"><span class="p-seg2" data-opt><button>단면</button><button class="is-on">양면</button></span></span>
        </div>

        <div class="p-opt">
          <span class="p-opt__icon" style="background:#f2eeff;color:#6f36ff">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 3.5h6l4 4v13H7z"/><path d="M13 3.5v4h4"/></svg>
          </span>
          <span class="p-opt__label">용지</span>
          <span class="p-opt__ctrl">
            <button class="p-value" data-go="paper.html">A4
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
            </button>
          </span>
        </div>

        <div class="p-opt">
          <span class="p-opt__icon" style="background:#e9f8f0;color:#12a06a">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4.5" y="7" width="10" height="12" rx="2.5"/><path d="M9.5 7V5.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H16"/></svg>
          </span>
          <span class="p-opt__label">방향</span>
          <span class="p-opt__ctrl"><span class="p-seg2" data-opt><button class="is-on">세로</button><button>가로</button></span></span>
        </div>
      </div>
    </div>

    <div class="p-card">
      <div class="p-cardhead">
        <span class="p-cardhead__icon" style="background:#f2eeff;color:#6f36ff">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>
          </svg>
        </span>
        <div>
          <div class="p-cardhead__title">알림 설정</div>
          <div class="p-cardhead__desc">앱 내 알림에만 적용됩니다.</div>
        </div>
      </div>

      <div class="p-note">
        <div>
          <div class="p-note__title">출력 완료 알림</div>
          <div class="p-note__desc">출력이 완료되면 알림을 보내드려요.</div>
        </div>
        <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="switch__track"></span></label>
      </div>
      <div class="p-note">
        <div>
          <div class="p-note__title">환불 처리 알림</div>
          <div class="p-note__desc">환불 처리가 완료되면 알림을 보내드려요.</div>
        </div>
        <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="switch__track"></span></label>
      </div>
    </div>

    <button class="p-logout" data-go="login.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M15 8.5 19 12l-4 3.5M19 12H9.5"/>
      </svg>
      로그아웃
      <svg class="p-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <p class="p-version">앱 버전 1.2.0</p>
  </main>

  <nav class="p-tab">
    <a class="p-tab__item" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3.5 10v10.3h6v-6h5v6h6V10L12 3.2Z"/></svg>
      <span>홈</span>
    </a>
    <a class="p-tab__item" href="history.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2" stroke-linecap="round"/></svg>
      <span>이력</span>
    </a>
    <a class="p-tab__item is-on" href="settings.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.8-1.3-1.8-3.2-2.1.8a7.7 7.7 0 0 0-2.6-1.5L14.4 3h-3.7l-.3 2.3c-1 .3-1.8.8-2.6 1.5l-2.1-.8-1.8 3.2 1.8 1.3a7.6 7.6 0 0 0 0 3l-1.8 1.3 1.8 3.2 2.1-.8c.8.7 1.6 1.2 2.6 1.5l.3 2.3h3.7l.3-2.3c1-.3 1.8-.8 2.6-1.5l2.1.8 1.8-3.2-1.8-1.3Z"/></svg>
      <span>설정</span>
    </a>
  </nav>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/proposal.js"></script>
<script>
  document.querySelectorAll('[data-opt]').forEach(function (box) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
    });
  });
</script>
</body>
</html>
