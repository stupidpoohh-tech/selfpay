<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비회원 이용 · 제안 | 무인과금출력</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/font.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/proposal.css">
</head>
<body>
<div class="app">
  <header class="p-appbar">
    <div class="p-appbar__brand"><img src="../assets/img/logo.svg" alt="">무인과금출력</div>
    <div class="p-appbar__actions">
      <button class="p-round" data-go="notifications.html" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>
        </svg>
      </button>
      <button class="p-round" data-go="settings.html" aria-label="내 정보">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21H4Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="p-page p-page--cta">
    <div class="p-topart" style="margin-top:8px">
      <div class="p-art" data-art="printer" data-note="로그인 없이<br>바로 시작!"></div>
      <h1 class="p-h1">비회원 이용</h1>
      <p class="p-sub" style="max-width:62%">로그인 없이도 바로 인쇄·복사·스캔·팩스를 시작할 수 있어요.</p>
    </div>

    <div class="p-notice" style="margin-top:16px">
      <span class="p-notice__icon">i</span>
      <div>
        <div class="p-notice__title">비회원으로 이용할 수 있어요.</div>
        <div class="p-notice__body">
          로그인 없이도 인쇄, 복사, 스캔, 팩스 서비스를 이용할 수 있습니다.<br>
          단, 작업 이력과 영수증은 저장되지 않아요.<br>
          영수증이 필요하신 경우 아래에 휴대폰 번호를 입력해 주세요.
        </div>
      </div>
    </div>

    <p class="p-label">휴대폰 번호</p>
    <input class="p-input" type="tel" id="phone" placeholder="010-0000-0000">
    <p class="p-hint"><span class="p-hint__icon">!</span>영수증이 필요할 때만 입력하세요.</p>
  </main>

  <div class="p-cta">
    <button class="p-btn" data-go="index.html">바로 시작하기</button>
    <button class="p-btn p-btn--ghost" data-go="login.html">로그인 화면으로</button>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/proposal.js"></script>
</body>
</html>
