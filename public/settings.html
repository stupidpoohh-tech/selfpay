<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>설정 | 무인과금출력</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/font.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span></span><h1 class="titlebar__title">설정</h1><span></span>
  </header>

  <main class="page has-nav" style="display:flex;flex-direction:column">
    <div class="card">
      <div class="profile">
        <div class="avatar" id="avatar">비</div>
        <div class="profile__body">
          <div class="profile__name" id="userName">비회원</div>
          <div class="profile__mail" id="userMail"></div>
        </div>
        <button class="profile__edit" data-go="profile.html">수정</button>
      </div>
    </div>

    <p class="section-label">기본 출력 옵션</p>
    <div class="card card--pad">
      <div class="row"><span class="row__label">컬러</span>
        <select class="select" data-opt="color"><option value="color">컬러</option><option value="mono">흑백</option></select>
      </div>
      <div class="row"><span class="row__label">양면</span>
        <select class="select" data-opt="duplex"><option value="single">단면</option><option value="double">양면</option></select>
      </div>
      <div class="row"><span class="row__label">용지</span>
        <select class="select" data-opt="paper"><option value="A4">A4</option><option value="A3">A3</option><option value="B5">B5</option></select>
      </div>
      <div class="row"><span class="row__label">방향</span>
        <select class="select" data-opt="orient"><option value="portrait">세로</option><option value="landscape">가로</option></select>
      </div>
    </div>

    <p class="section-label">알림 설정</p>
    <p class="help help--right" style="margin:-4px 0 8px">앱 안 알림함 표시용입니다. 휴대폰 시스템 알림 권한과는 다릅니다.</p>
    <div class="card card--pad">
      <div class="row"><span class="row__label">출력 완료 알림</span>
        <label class="switch"><input type="checkbox" data-notify="done"><span class="switch__track"></span></label>
      </div>
      <div class="row"><span class="row__label">환불 처리 알림</span>
        <label class="switch"><input type="checkbox" data-notify="refund"><span class="switch__track"></span></label>
      </div>
    </div>

    <div style="margin-top:auto;padding-top:28px">
      <button class="btn btn--ghost" id="signOut">로그아웃</button>
    </div>
  </main>

  <nav class="tabbar">
    <button class="tab" data-go="home.html">홈</button>
    <button class="tab" data-go="history.html">이력</button>
    <button class="tab is-on">설정</button>
  </nav>
</div>

<script src="assets/js/app.js"></script>
<script>
  var user = SP.requireUser();
  if (user) {
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userMail').textContent = user.email;
    document.getElementById('avatar').textContent = user.name.slice(0, 1);
  }

  var state = SP.state();
  document.querySelectorAll('[data-opt]').forEach(function (sel) {
    sel.value = state.options[sel.getAttribute('data-opt')];
    sel.addEventListener('change', function () {
      SP.update(function (s) { s.options[sel.getAttribute('data-opt')] = sel.value; });
    });
  });

  document.querySelectorAll('[data-notify]').forEach(function (box) {
    box.checked = !!state.notify[box.getAttribute('data-notify')];
    box.addEventListener('change', function () {
      SP.update(function (s) { s.notify[box.getAttribute('data-notify')] = box.checked; });
    });
  });

  document.getElementById('signOut').addEventListener('click', function () { SP.signOut(); });
</script>
</body>
</html>
