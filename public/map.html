<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화면 맵 | 무인과금출력</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/font.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/map.css">
</head>
<body>
<div class="map">
  <header class="map__bar">
    <button class="map__btn" type="button" onclick="location.href='index.html'">리뷰 보드</button>
    <h1 class="map__title">화면 맵</h1>
    <span class="map__spacer"></span>
    <button class="map__btn" id="toggleBack">돌아가는 경로</button>
    <button class="map__btn" id="zoomOut" aria-label="축소">−</button>
    <button class="map__btn" id="zoomIn" aria-label="확대">＋</button>
    <button class="map__btn" id="zoomFit">맞춤</button>
  </header>

  <div class="map__legend">
    <span class="key"><i class="key__dot" style="background:#e9f2ff;box-shadow:inset 0 0 0 1px #2870ff"></i><b>화면 있음</b></span>
    <span class="key"><i class="key__dot" style="background:#fff1e4;box-shadow:inset 0 0 0 1px #d9662a"></i><b>일부</b></span>
    <span class="key"><i class="key__dot" style="background:#f0f2f5;box-shadow:inset 0 0 0 1px #aab1bb"></i><b>비어 있음</b></span>
    <span class="key"><i class="key__line"></i>이동</span>
    <span class="key"><i class="key__line key__line--back"></i>되돌아가기</span>
    <span class="key"><i class="key__line key__line--tab"></i>하단 탭</span>
    <span>노드를 누르면 그 화면이 열립니다</span>
  </div>

  <div class="map__viewport" id="viewport">
    <div class="map__world" id="world">
      <svg class="map__edges" id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<script src="assets/js/map.js"></script>
</body>
</html>
