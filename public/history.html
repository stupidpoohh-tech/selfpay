<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>작업 이력 | 무인과금출력</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/font.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span></span><h1 class="titlebar__title">작업 이력</h1><span></span>
  </header>

  <main class="page has-nav">
    <div class="segment" id="segment">
      <button class="segment__item is-on"><b>전체</b><span>0건</span></button>
      <button class="segment__item"><b>작업중</b><span>0건</span></button>
      <button class="segment__item"><b>완료</b><span>0건</span></button>
    </div>

    <div class="chips" id="chips">
      <button class="chip is-on">전체</button>
      <button class="chip">인쇄</button>
      <button class="chip">복사</button>
      <button class="chip">스캔</button>
      <button class="chip">팩스</button>
    </div>

    <p class="empty">작업 이력이 없습니다.</p>
  </main>

  <nav class="tabbar">
    <button class="tab" data-go="home.html">홈</button>
    <button class="tab is-on">이력</button>
    <button class="tab" data-go="settings.html">설정</button>
  </nav>
</div>

<script src="assets/js/app.js"></script>
<script>
  SP.requireUser();

  /* 이력이 없으므로 필터는 선택 표시만 바뀐다. */
  function pick(container, selector) {
    container.addEventListener('click', function (e) {
      var b = e.target.closest(selector);
      if (!b) return;
      container.querySelectorAll(selector).forEach(function (x) {
        x.classList.toggle('is-on', x === b);
      });
    });
  }
  pick(document.getElementById('segment'), '.segment__item');
  pick(document.getElementById('chips'), '.chip');
</script>
</body>
</html>
