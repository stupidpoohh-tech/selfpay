<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비밀번호 찾기 | 무인과금출력</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/font.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <header class="titlebar titlebar--plain">
    <button class="titlebar__back" data-go="index.html">뒤로</button>
    <h1 class="titlebar__title">비밀번호 찾기</h1><span></span>
  </header>

  <main class="page has-cta">
    <p class="lead">가입한 <b>이메일</b>로 재설정 링크를 보내드립니다.</p>
    <div class="field"><label class="field__label" for="email">이메일</label>
      <input class="input" type="email" id="email" placeholder="example@email.com"></div>
    <div id="sent"></div>
  </main>

  <div class="cta"><button class="btn" id="sendBtn">재설정 링크 받기</button></div>
</div>

<script src="assets/js/app.js"></script>
<script>
  document.getElementById('sendBtn').addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return SP.toast('이메일 주소를 확인해 주세요');
    document.getElementById('sent').innerHTML =
      '<div class="card card--pad" style="margin-top:16px"><div class="row"><span class="row__label">' +
      email + ' 로 링크를 보냈습니다</span></div></div>' +
      '<p class="help" style="margin-top:10px">메일이 오지 않으면 스팸함을 확인해 주세요.</p>';
  });
</script>
</body>
</html>
